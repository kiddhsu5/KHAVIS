# Capability → pool mappings for the khavis.
#
# Each entry advertises a capability tag (see providers/* capabilities[])
# and a list of pool names that satisfy it. ``weight`` controls the
# weighted-random share used by ``CapabilityRouter.select``.
#
# ``pools`` accepts (see core.capability_router.CapabilityEntry):
#   - plain names           → use the entry-wide ``weight``
#   - ``- "Pool": 0.85``    → per-pool weight override (single-key map)
#   - a full map ``{A: 1.2, B: 0.85}`` instead of a list
# List order is preserved and is the failover order for strategy=priority.
# A weight of 0 means "never pick under weighted routing".
#
# Pool names referenced here MUST match the ``name`` attribute of the
# corresponding plugin instance (see providers/* for the canonical list).
#
# Note: pools backed by ``BYOK-only`` providers (OpenAI Platform API,
# Claude API, NVIDIA Cloud) carry an explicit per-pool weight of 0.85
# (``- "OpenAI-API": 0.85``) because they require a separate billing
# account and may not be configured by every user. Every other pool uses
# its entry's ``weight`` (0.9–1.3).

capabilities:
  - capability: "中文"
    pools:
      - "MiniMax-M3"
      - "MiMo-Code"
      - "GLM-5.3"
      - "DeepSeek-V4-Pro"
      - "DeepSeek-V4.1-Flash"
      - "GLM-5.3-Flash"
      - "Ollama-Mac"
      - "Ollama-Surface"
      - "Moonshot-Kimi"
      - "Qwen-DashScope"
      - "DeepSeek-Official"
    weight: 1.0

  - capability: "英文"
    pools:
      - "Google-Gemini"
      - "NVIDIA-Cloud": 0.85
      - "OpenRouter-Free"
      - "DeepSeek-V4-Pro"
