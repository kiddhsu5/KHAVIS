name: khavis-integration

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Comma-separated providers to test (openai,gemini,ollama,...)"
        required: false
        default: "openai"
        type: string
  schedule:
    # Weekly run on Sunday 02:00 UTC
    - cron: "0 2 * * 0"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: khavis-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Live integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run integration test
        id: integ
        continue-on-error: true
        env:
          KHAVIS_PROVIDERS: ${{ github.event.inputs.providers || 'openai' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          VOLCANO_API_KEY: ${{ secrets.VOLCANO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
        run: |
          if [ -f scripts/integration_test.py ]; then
            python scripts/integration_test.py \
              --providers "$KHAVIS_PROVIDERS" \
              --output junit-xml=/tmp/integration.junit.xml \
              --output json=/tmp/integration.json
          else
            echo "scripts/integration_test.py not found; skipping live run."
            exit 0
          fi

      - name: Publish results summary
        if: always()
        run: |
          echo "## Integration test results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f /tmp/integration.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat /tmp/integration.json | head -200 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_No integration JSON report produced._" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khavis-integration-${{ github.run_id }}
          path: |
            /tmp/integration.junit.xml
            /tmp/integration.json
          if-no-files-found: ignore

      - name: Fail job if integration exited non-zero
        if: steps.integ.outcome == 'failure'
        run: |
          echo "Integration test failed; see artifacts." >&2
          exit 1