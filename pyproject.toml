[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "khavis"
version = "0.5.0"
description = "A plugin-based router for multiple LLM providers with hot-reloadable config and capability-aware dispatch."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "K.H.A.V.I.S. maintainers", email = "kiddhsu5@users.noreply.github.com" },
]
keywords = ["llm", "router", "openai", "gemini", "ollama", "ai-gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "watchdog>=3.0.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # Shipped provider: providers/claude.py imports the Anthropic SDK.
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
bot = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    # NOTE: ``python-telegram-bot`` is intentionally NOT a dependency.
    # The bot talks to the Telegram Bot API directly over httpx; pulling
    # in PTB would pin ``httpx~=0.25.2`` (for PTB 20.x) or ``~=0.27``
    # (for PTB 21.x) and conflict with the range above.
]
# `khavis-serve` — the OpenAI-compatible HTTP API in server/openai_api.py.
# Separate from `bot` so a plain `pip install khavis` stays small, but note
# that both entry points need FastAPI.
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
# Multi-agent orchestration (agents/graph.py). Kept out of the core install
# because langgraph is a heavy dependency that plain routing never imports.
agents = [
    "langgraph>=0.2.0",
]
# Semantic memory backends for core/rag.py.
rag = [
    "chromadb>=0.5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
    "build>=1.2",
    "twine>=5.0",
    # tests/test_graph.py and tests/test_agent_factory_parallel.py import
    # agents/, which imports langgraph at module level.
    "langgraph>=0.2.0",
]

[project.urls]
Homepage = "https://khavis.khorus.tech"
Repository = "https://github.com/kiddhsu5/KHAVIS"
Documentation = "https://github.com/kiddhsu5/KHAVIS/blob/main/README.md"
Issues = "https://github.com/kiddhsu5/KHAVIS/issues"
Changelog = "https://github.com/kiddhsu5/KHAVIS/blob/main/CHANGELOG.md"

[project.scripts]
khavis = "core.cli:main"
khavis-bot = "bot.main:main"
khavis-serve = "server.openai_api:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "providers", "bot", "server", "agents", "web"]

# `include` is a *filter*, not an inclusion list — once `packages` is set it
# cannot add files from outside those directories, so the previous config
# silently shipped a wheel with no config/, README, or LICENSE in it.
# `force-include` is the directive that actually adds them.
[tool.hatch.build.targets.wheel.force-include]
"config" = "config"
"scripts/start.sh" = "scripts/start.sh"
# README/LICENSE/CHANGELOG are NOT force-included: they would land at the
# site-packages root. README ships in METADATA, LICENSE in dist-info.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501", # line length (ruff format handles it)
]

[tool.ruff.lint.per-file-ignores]
"scripts/test_plugins.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
disallow_incomplete_defs = false
files = ["core", "providers", "bot", "agents", "server"]
# The `X = None` import-guard pattern in every provider module triggers
# mypy's [misc] check; the `# type: ignore[misc]` annotations would
# themselves emit [unused-ignore] when SDKs are installed. Suppress
# both — they're a known idiom for optional runtime deps.
disable_error_code = [
    "misc",
    "unused-ignore",
    "assignment",
    "valid-type",
    "attr-defined",
    "func-returns-value",
    "return-value",
]

[[tool.mypy.overrides]]
module = ["scripts.*", "bot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Default to unit tests only — integration tests require API keys and
# are opted into with ``pytest -m integration``. (Formerly pytest.ini,
# which silently shadowed this table.)
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "integration: marks tests as integration (deselect with -m 'not integration')",
    "slow: marks slow tests",
    "unit: offline tests that mock all external I/O",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
