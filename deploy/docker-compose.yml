# docker-compose.yml for khavis-bot.
#
# Usage:
#   cp deploy/.env.example .env  # fill in BOT_TOKEN etc.
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d
#
# Notes:
#   - The bot listens on 127.0.0.1:8080; only Caddy exposes :443 publicly.
#   - The certs/ dir is mounted read-only with the LE chain + private key.
#   - Override `BOT_MODE=polling` for long-poll fallback (no public
#     endpoint required). In that case drop the caddy service.

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [botnet]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2019/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env  # BOT_TOKEN, WEBHOOK_SECRET (required in webhook mode), ALLOWED_CHAT_IDS
    environment:
      BOT_MODE: webhook
      BOT_HOST: 127.0.0.1
      BOT_PORT: "8080"
      # Optional backend-specific defaults:
      CLAUDE_DISPATCH_MODEL: ""
      CODEX_DISPATCH_MODEL: ""
      # long-poll toggle — set to "polling" if you skip the caddy service
    depends_on:
      caddy:
        condition: service_healthy
    networks: [botnet]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  botnet:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: